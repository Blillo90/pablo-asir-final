- name: Incidencias (Flask) en Kubernetes con replicas + Ingress
  hosts: master
  become: true

  vars_files:
    - ../group_vars/all/vars.yml

  pre_tasks:
    - name: Convertir replicas a int real
      set_fact:
        inc_replicas_int: "{{ inc_replicas | int }}"

    - name: Instalar dependencias Python para kubernetes.core.k8s (APT)
      apt:
        name:
          - python3-kubernetes
          - python3-yaml
        update_cache: true
        state: present

    - name: Verificar que existe el kubeconfig de k3s
      stat:
        path: "{{ kubeconfig_path }}"
      register: kubeconfig_stat

    - name: Fallar si no existe kubeconfig
      fail:
        msg: "No existe kubeconfig en {{ kubeconfig_path }}. ¿Has instalado k3s server y estás usando la ruta correcta?"
      when: not kubeconfig_stat.stat.exists

    # Normalizamos imagen para evitar problemas de resolución (k3s/containerd)
    - name: Normalizar nombre de imagen (forzar docker.io)
      set_fact:
        inc_image_norm: >-
          {{
            (inc_image.startswith('docker.io/') | ternary(inc_image, 'docker.io/' ~ inc_image))
          }}

    - name: Construir manifiesto Deployment Incidencias (YAML -> dict) con replicas INT real
      set_fact:
        inc_deployment_manifest: "{{ inc_deployment_manifest_yaml | from_yaml }}"
      vars:
        inc_deployment_manifest_yaml: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: {{ inc_app_name }}
            namespace: {{ inc_namespace }}
          spec:
            replicas: {{ inc_replicas_int }}
            selector:
              matchLabels:
                app: {{ inc_app_name }}
            template:
              metadata:
                labels:
                  app: {{ inc_app_name }}
              spec:
                containers:
                  - name: {{ inc_app_name }}
                    image: {{ inc_image_norm }}
                    imagePullPolicy: Always
                    ports:
                      - containerPort: 5000
                    envFrom:
                      - secretRef:
                          name: inc-db-secret
                    readinessProbe:
                      httpGet:
                        path: /health
                        port: 5000
                      initialDelaySeconds: 5
                      periodSeconds: 10
                    livenessProbe:
                      httpGet:
                        path: /health
                        port: 5000
                      initialDelaySeconds: 10
                      periodSeconds: 15

  tasks:
    - name: Crear namespace
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        wait: true
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ inc_namespace }}"

    - name: Crear/actualizar Secret DB
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        wait: true
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: inc-db-secret
            namespace: "{{ inc_namespace }}"
          type: Opaque
          stringData:
            DB_HOST: "{{ inc_db_host }}"
            DB_PORT: "{{ inc_db_port }}"
            DB_NAME: "{{ inc_db_name }}"
            DB_USER: "{{ inc_db_user }}"
            DB_PASSWORD: "{{ inc_db_pass }}"

    - name: Aplicar Deployment
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        wait: true
        definition: "{{ inc_deployment_manifest }}"

    - name: Crear/actualizar Service
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        wait: true
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: "{{ inc_app_name }}"
            namespace: "{{ inc_namespace }}"
          spec:
            selector:
              app: "{{ inc_app_name }}"
            ports:
              - name: http
                port: 80
                targetPort: 5000

    - name: Crear/actualizar Ingress
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        wait: true
        definition:
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: "{{ inc_app_name }}-ingress"
            namespace: "{{ inc_namespace }}"
          spec:
            rules:
              - host: "{{ inc_host }}"
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: "{{ inc_app_name }}"
                          port:
                            number: 80

    - name: Reiniciar rollout para forzar pull de la imagen (si ya existía el deployment)
      shell: kubectl -n {{ inc_namespace }} rollout restart deploy/{{ inc_app_name }}
      changed_when: false

    - name: Esperar a que el deployment esté disponible
      shell: kubectl -n {{ inc_namespace }} rollout status deploy/{{ inc_app_name }} --timeout=300s
      changed_when: false

    - name: Mostrar estado (pods/svc/ingress)
      shell: |
        kubectl -n {{ inc_namespace }} get pods -o wide
        kubectl -n {{ inc_namespace }} get svc
        kubectl -n {{ inc_namespace }} get ingress
      changed_when: false